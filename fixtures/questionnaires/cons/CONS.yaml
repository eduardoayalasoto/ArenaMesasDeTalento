  questions:
  - title: Habilidad de comunicación
    category: delivery_cliente
    weight: 20.0
    text: Redacta de manera adecuada y concisa. Se expresa de forma clara y de acuerdo al nivel requerido
      por la audiencia. Sobrelleva los objetivos del trabajo de campo en entornos complejos y adversos.
      Revisa al equipo en la ejecución, documentación de las entrevistas e interpretación de las conclusiones.
      Es un referente para el equipo en la realización de presentaciones, consiguiendo que la audiencia
      crea en los mensajes transmitidos
    level_expectation: N4 · Referente
    guidance: 'Skills: Mapeo de actores y RACI · Facilitación de sesiones con cliente · Defensa de alcance
      y conversaciones difíciles · Obtención de VOBO · Bloque: Gestión de cliente y stakeholders'
  - title: Comprensión del alcance
    category: delivery_cliente
    weight: 20.0
    text: Domina el alcance las tareas asignadas a cada miembro del equipo. Es reponsable de explicar
      el alcance del proyecto y se asegura de que cada miembro del equipo tenga claridad. Es capaz de
      impulsar oportunidades para otros proyectos o extensiones fuera del alcance
    level_expectation: N4 · Referente
    guidance: 'Skills: Definición de alcance y no-alcance · Estimación de complejidad · Priorización MoSCoW
      · Validación de supuestos de datos · Bloque: Dimensionamiento de alcance y complejidad'
  - title: Nivel de relación con el cliente
    category: delivery_cliente
    weight: 20.0
    text: Su imagen y comportamiento con el cliente es un modelo de referencia para el equipo. Logra confianza
      y credibilidad en todos los niveles de la organización
    level_expectation: N4 · Referente
    guidance: 'Skills: Mapeo de actores y RACI · Facilitación de sesiones con cliente · Defensa de alcance
      y conversaciones difíciles · Obtención de VOBO · Bloque: Gestión de cliente y stakeholders'
  - title: Transformación organizacional
    category: delivery_cliente
    weight: 20.0
    text: Domina cómo la estructura de la organización habilita la ejecución de los procesos de negocio
      necesarios para lograr sus objetivos. Es capaz de diseñar la organización más adecuada para habilitar
      la ejecución de los procesos de negocio a lo largo del tiempo y de implementar el cambio
    level_expectation: N4 · Referente
    guidance: 'Skills: Diseño de transferencia de conocimiento · Medición de adopción · Diagnóstico de
      resistencia e intervención · Bloque: Gestión del cambio y adopción'
  - title: Sentido de negocio
    category: delivery_cliente
    weight: 20.0
    text: Domina el comportamiento de la industria  y su relación directa con la toma de decisiones  en
      el corto, mediano y largo plazo para ofrecer soluciones apegadas a las necesidades y realidad de
      la empresa. Es capaz de definir un plan de desarrollo y maduración para el crecimiento del cliente
    level_expectation: N4 · Referente
    guidance: 'Skills: Levantamiento de proceso operativo · Redacción de reglas de negocio · Identificación
