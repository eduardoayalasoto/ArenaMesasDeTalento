    category: delivery_cliente
    weight: 15.4
    text: Comprende el alcance de sus tareas y, en general, de las tareas asignadas a todo el equipo.
      Identifica las herramientas e información requeridas para hacerlas correctamente
    level_expectation: N2 · Contribuye
    guidance: 'Skills: Definición de alcance y no-alcance · Estimación de complejidad · Priorización MoSCoW
      · Validación de supuestos de datos · Bloque: Dimensionamiento de alcance y complejidad'
  - title: Nivel de relación con el cliente
    category: delivery_cliente
    weight: 23.1
    text: Consigue movilizar a diferentes niveles de la organización del cliente para asegurar el cumplimiento
      de los objetivos
    level_expectation: N3 · Autónomo
    guidance: 'Skills: Mapeo de actores y RACI · Facilitación de sesiones con cliente · Defensa de alcance
      y conversaciones difíciles · Obtención de VOBO · Bloque: Gestión de cliente y stakeholders'
  - title: Transformación organizacional
    category: delivery_cliente
    weight: 15.4
    text: Entiende los requerimientos para lograr una implementación exitosa, plantea y obtiene dichos
      requerimientos oportunamente. Explica al cliente, con ayuda del Consultor Senior / Gerente los beneficios
      de cambiar la rutina o hábito de trabajo
    level_expectation: N2 · Contribuye
    guidance: 'Skills: Diseño de transferencia de conocimiento · Medición de adopción · Diagnóstico de
      resistencia e intervención · Bloque: Gestión del cambio y adopción'
  - title: Sentido de negocio
    category: delivery_cliente
    weight: 23.0
    text: Comprende a profundidad la operación y la situación actual de la organización, de tal forma,
      que es capaz de ofrecer soluciones oportunas
    level_expectation: N3 · Autónomo
    guidance: 'Skills: Levantamiento de proceso operativo · Redacción de reglas de negocio · Identificación
      de reglas multi-paso · Cuantificación del caso de valor · Metodologías de diagnóstico y diseño ·
      Bloque: Diagnóstico y análisis de negocio'
  - title: Capacidad de análisis
    category: desarrollo_producto
    weight: 33.4
    text: Identifica los recursos clave y estima los esfuerzos necesarios para la realización del análisis,
      con ayuda del Consultor Senior / Gerente. Utiliza las fuentes de información más fiables en los
      análisis que realiza
    level_expectation: N3 · Autónomo
    guidance: 'Skills: Exploración y perfilado de datos · Consulta de datos con SQL · Definición y auditoría
      de indicadores · Lectura crítica de resultados de modelo · Bloque: Análisis de datos y validación'
  - title: Capacidad de síntesis
    category: desarrollo_producto
    weight: 33.3
