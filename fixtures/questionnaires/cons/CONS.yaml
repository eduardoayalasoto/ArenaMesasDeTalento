source: Matriz de Competencias y Pesos por Puesto v1.1.xlsx
templates:
- area: CONS
  level: JR
  scale_note: Califica cada competencia del 1 al 4 contra el nivel esperado para tu puesto (3 = cumple
    satisfactoriamente). «Apego a los valores» se califica pero no pondera en el score.
  scale:
  - value: 1
    label: No cumple
    order: 1
    description: No cumple con lo mínimo esperado para su rol en el proyecto.
  - value: 2
    label: Necesita mejorar
    order: 2
    description: Cumple parcialmente con lo esperado para su rol en el proyecto.
  - value: 3
    label: Cumple satisfactoriamente
    order: 3
    description: Cumple en su totalidad y de manera satisfactoria con lo esperado para su rol. La descripción
      del nivel esperado está redactada contra esta calificación.
  - value: 4
    label: Excede
    order: 4
    description: Excede frecuentemente las expectativas de acuerdo a su rol y/o cumple funciones de un
      rol superior al actual.
  - value: null
    label: N/A
    order: 5
    description: No aplica en este periodo por razones justificadas. No entra al promedio.
  categories:
  - code: delivery_cliente
    name: Delivery al cliente
    weight: 13.6
  - code: desarrollo_producto
    name: Desarrollo de producto
    weight: 22.7
  - code: herramientas_gestion
    name: Herramientas de gestión
    weight: 18.2
  - code: actitud_persona
    name: Actitud y persona
    weight: 45.5
  questions:
  - title: Habilidad de comunicación
    category: delivery_cliente
    weight: 33.4
    text: Redacta de manera adecuada y concisa. Se expresa de forma clara, de acuerdo al nivel requerido
      por la audiencia. Organiza y ejecuta con calidad el trabajo de campo (entrevistas, focus group o
      workshop) siguiendo el guión definido con mínima supervisión del Consultor o Consultor Senior
    level_expectation: N1 · Expuesto
    guidance: 'Skills: Mapeo de actores y RACI · Facilitación de sesiones con cliente · Defensa de alcance
      y conversaciones difíciles · Obtención de VOBO · Bloque: Gestión de cliente y stakeholders'
  - title: Comprensión del alcance
    category: delivery_cliente
    weight: 33.3
    text: Entiende el alcance de sus tareas, el tiempo que dispone para realizarlas y las herramientas
      e información requeridas para hacerlas correctamente
    level_expectation: N1 · Expuesto
    guidance: 'Skills: Definición de alcance y no-alcance · Estimación de complejidad · Priorización MoSCoW
      · Validación de supuestos de datos · Bloque: Dimensionamiento de alcance y complejidad'
  - title: Nivel de relación con el cliente
    category: delivery_cliente
    weight: 33.3
    text: Trabaja directamente con determinados miembros del equipo del cliente
    level_expectation: N1 · Expuesto
    guidance: 'Skills: Mapeo de actores y RACI · Facilitación de sesiones con cliente · Defensa de alcance
      y conversaciones difíciles · Obtención de VOBO · Bloque: Gestión de cliente y stakeholders'
  - title: Capacidad de análisis
    category: desarrollo_producto
    weight: 40.0
    text: Comienza a identificar diferencias en los análisis básicos con ayuda del Consultor / Consultor
      Senior. Valora, con supervisión del Consultor/ Consultor Senior, la calidad de las fuentes de información
      básicas-usuales. Comprueba la validez del análisis con juicio crítico antes de entregarlo
    level_expectation: N2 · Contribuye
    guidance: 'Skills: Exploración y perfilado de datos · Consulta de datos con SQL · Definición y auditoría
      de indicadores · Lectura crítica de resultados de modelo · Bloque: Análisis de datos y validación'
  - title: Capacidad de síntesis
    category: desarrollo_producto
    weight: 20.0
    text: Comienza a interpretar y sintetizar la información obtenida con ayuda del Consultor / Consultor
      Senior. Comprueba la validez de la síntesis con juicio crítico antes de entregarlo
    level_expectation: N1 · Expuesto
    guidance: 'Skills: Modelado conceptual de entidades y grano · Redacción de criterios de aceptación
      · Trazabilidad requerimiento–regla–criterio · Lectura de arquitectura de solución · Bloque: Especificación
      y modelado del problema'
  - title: Dominio de herramientas
    category: desarrollo_producto
    weight: 40.0
    text: Entiende, a nivel general, la funcionalidad de Excel, PowerPoint, Power BI y los procesos que
      soportan
    level_expectation: N2 · Contribuye
    guidance: 'Skills: Exploración y perfilado de datos · Consulta de datos con SQL · Definición y auditoría
      de indicadores · Lectura crítica de resultados de modelo · Bloque: Análisis de datos y validación'
  - title: IA como productividad
    category: desarrollo_producto
    weight: 0.0
    text: Usa IA para acelerar sus propios análisis, la redacción de artefactos y la documentación con
      instrucciones estructuradas. Verifica la fuente de todo lo que publica antes de entregarlo. Produce
      con revisión previa de su líder.
    level_expectation: N2 · Contribuye
    guidance: 'Skills: Prompting estructurado · Revisión crítica de salida de IA · Automatización de tareas
      propias · Bloque: IA como productividad'
  - title: Planificación del trabajo
    category: herramientas_gestion
    weight: 50.0
    text: Facilita el seguimiento del plan de trabajo documentando con frecuencia y claridad el grado
      de avance. Comienza a identificar y aplica mejoras en la gestión de su tiempo
    level_expectation: N2 · Contribuye
    guidance: 'Skills: Versionado y bitácora · Operación de Arena Ops · Control de cambios · Bloque: Disciplina
      de WoW y gestión'
  - title: Generación de conocimiento
    category: herramientas_gestion
    weight: 50.0
    text: Se encarga, con ayuda del Consultor / Consultor Senior de documentar los benchmarks que corresponden
      a su área de trabajo
    level_expectation: N2 · Contribuye
    guidance: 'Skills: Versionado y bitácora · Operación de Arena Ops · Control de cambios · Bloque: Disciplina
      de WoW y gestión'
  - title: Disciplina de forma de trabajo
    category: herramientas_gestion
    weight: 0.0
    text: Opera el esquema de versionado MAJOR.MINOR y la bitácora en su propio trabajo, con revisión
      previa. Carga y mantiene su trabajo en el backlog único del proyecto. Puede generar retrabajo ocasional
      en el gate.
    level_expectation: N2 · Contribuye
    guidance: 'Skills: Versionado y bitácora · Operación de Arena Ops · Control de cambios · Bloque: Disciplina
      de WoW y gestión'
  - title: Apego a los valores de Arena Analytics
    category: actitud_persona
    weight: 0.0
    text: Tiene conocimiento y claridad de los valores de Arena Analytics. Actúa, en todo momento, de
      acuerdo a ellos y los identifica como pilar para desempeñar su trabajo
    level_expectation: No pondera (filtro)
    guidance: 'Se califica de 1 a 4 (3 = cumple). No pondera en el score: sirve como filtro de valores;
      una calificación baja se ve en el informe. · Bloque: — (filtro de valores)'
  - title: Proactividad
    category: actitud_persona
    weight: 20.0
    text: Tiene un comportamiento o actitud anticipatoria ante las situaciones que pudieran surgir durante
      el proyecto y lo comunica a sus líderes
    level_expectation: N2 · Contribuye
    guidance: 'Bloque: Competencia de persona'
  - title: Búsqueda de la excelencia
    category: actitud_persona
    weight: 20.0
    text: Su trabajo alcanza, con cierta autonomía, la calidad esperada. Se asegura de cumplir con las
      expectativas
    level_expectation: N2 · Contribuye
    guidance: 'Bloque: Competencia de persona'
  - title: Innovación y creatividad
    category: actitud_persona
    weight: 20.0
    text: Muestra curiosidad por aprender las diferentes metodologías de análisis y de desarrollo
    level_expectation: N2 · Contribuye
    guidance: 'Bloque: Competencia de persona'
  - title: Contribución al equipo
    category: actitud_persona
    weight: 20.0
    text: Brinda su apoyo al equipo, cuando es necesario
    level_expectation: N2 · Contribuye
    guidance: 'Bloque: Competencia de persona'
  - title: Orientación a resultados
    category: actitud_persona
    weight: 20.0
    text: Se centra en cumplir con los objetivos y/o resultados esperados en su área de trabajo, con apoyo
      y supervisión del Consultor / Consultor Senior
    level_expectation: N2 · Contribuye
    guidance: 'Bloque: Competencia de persona'
