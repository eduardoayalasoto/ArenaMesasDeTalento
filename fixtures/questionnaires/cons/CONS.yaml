  - title: Proactividad
    category: actitud_persona
    weight: 20.0
    text: Tiene un comportamiento o actitud anticipatoria ante las situaciones que pudieran surgir durante
      el proyecto y lo comunica a sus líderes. Propone y busca el autoaprendizaje. No requiere de instrucciones
      detalladas
    level_expectation: N3 · Autónomo
    guidance: 'Bloque: Competencia de persona'
  - title: Búsqueda de la excelencia
    category: actitud_persona
    weight: 20.0
    text: Busca la excelencia en cada etapa de su línea de trabajo, esforzándose por alcanzarla. Se asegura
      de cumplir con las expectativas
    level_expectation: N3 · Autónomo
    guidance: 'Bloque: Competencia de persona'
  - title: Innovación y creatividad
    category: actitud_persona
    weight: 20.0
    text: Es capaz de aplicar las metodologías y enfoques propuestos bajo supervisión de su responsable
    level_expectation: N3 · Autónomo
    guidance: 'Bloque: Competencia de persona'
  - title: Contribución al equipo
    category: actitud_persona
    weight: 20.0
    text: Brinda ampliamente su apoyo al equipo y los desarrolla de manera indirecta trasmitiendo su conocimiento
    level_expectation: N3 · Autónomo
    guidance: 'Bloque: Competencia de persona'
  - title: Orientación a resultados
    category: actitud_persona
    weight: 20.0
    text: Comienza a plantear soluciones que se orientan a lograr resultados prácticos y tangibles
    level_expectation: N3 · Autónomo
    guidance: 'Bloque: Competencia de persona'
