      con ayuda del Consultor Senior / Gerente
    level_expectation: N3 · Autónomo
    guidance: 'Skills: Modelado conceptual de entidades y grano · Redacción de criterios de aceptación
      · Trazabilidad requerimiento–regla–criterio · Lectura de arquitectura de solución · Bloque: Especificación
      y modelado del problema'
  - title: Dominio de herramientas
    category: desarrollo_producto
    weight: 33.3
    text: Domina la funcionalidad de Excel y Power BI. Comienza a entender uno (o más) lenguaje de programación
      (VBA, SQL, Python, R) y de Power Point
    level_expectation: N3 · Autónomo
    guidance: 'Skills: Exploración y perfilado de datos · Consulta de datos con SQL · Definición y auditoría
      de indicadores · Lectura crítica de resultados de modelo · Bloque: Análisis de datos y validación'
  - title: IA como productividad
    category: desarrollo_producto
    weight: 0.0
    text: 'Reduce el tiempo de un ciclo de artefacto usando IA sin aumentar el retrabajo en el gate. Cero
      filas publicadas sin verificación de fuente: los errores se detectan antes del gate, no en él. Tiene
      al menos una tarea recurrente propia automatizada y documentada para uso del equipo.'
    level_expectation: N3 · Autónomo
    guidance: 'Skills: Prompting estructurado · Revisión crítica de salida de IA · Automatización de tareas
      propias · Bloque: IA como productividad'
  - title: Planificación del trabajo
    category: herramientas_gestion
    weight: 50.0
    text: Anticipa posibles riesgos para asegurar el cumplimiento al plan de trabajo bajo la supervisión
      del Consultor Senior / Gerente
    level_expectation: N3 · Autónomo
    guidance: 'Skills: Versionado y bitácora · Operación de Arena Ops · Control de cambios · Bloque: Disciplina
      de WoW y gestión'
  - title: Generación de conocimiento
    category: herramientas_gestion
    weight: 50.0
    text: Es capaz de registrar procesos de análisis de su área de trabajo
    level_expectation: N3 · Autónomo
    guidance: 'Skills: Versionado y bitácora · Operación de Arena Ops · Control de cambios · Bloque: Disciplina
      de WoW y gestión'
  - title: Disciplina de forma de trabajo
    category: herramientas_gestion
    weight: 0.0
    text: Cero cambios de contenido sin fila de bitácora. Ningún par MAJOR.MINOR reutilizado ni saltado.
      Cero trabajo en backlog que no pasó por la sesión de validación del viernes. Los cambios de negocio
      a media semana entran al ciclo siguiente, nunca al vigente.
    level_expectation: N3 · Autónomo
    guidance: 'Skills: Versionado y bitácora · Operación de Arena Ops · Control de cambios · Bloque: Disciplina
      de WoW y gestión'
  - title: Apego a los valores de Arena Analytics
    category: actitud_persona
    weight: 0.0
    text: Tiene conocimiento y claridad de los valores de Arena Analytics. Actúa, en todo momento, de
      acuerdo a ellos y los identifica como pilar para desempeñar su trabajo y los transmite a otros
    level_expectation: No pondera (filtro)
    guidance: 'Se califica de 1 a 4 (3 = cumple). No pondera en el score: sirve como filtro de valores;
