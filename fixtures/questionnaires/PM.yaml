          Analizar el impacto en fechas, dependencias y carga del equipo antes de ejecutar cambios en alcance o plan de trabajo.
      - title: "Clarificación de criterios de aceptación ambiguos"
        text: >-
          Detectar y resolver criterios incompletos o ambiguos comunicados por cliente o definidos en el alcance antes de la ejecución de los entregables relacionados.
      - title: "Detección temprana de desviaciones de calidad"
        text: >-
          Identificar desviaciones de calidad de forma recurrente durante la ejecución.
      - title: "Gestión consciente de dependencias"
        text: >-
          Identificar y destrabar dependencias que impactan la ejecución a través de un seguimiento y comunicación clara y puntual.
      - title: "Preparación para validaciones"
        text: >-
          Asegurar que entregables estén listos antes de sesiones con cliente.
      - title: "Traducción técnica de los elementos del proyecto al stakeholder"
        text: >-
          Aprovechar sesiones del proyecto para explicar aspectos técnicos de una forma clara a los stakeholders que no son técnicos, con el lenguaje y detalle que se adapta al stakeholder.
      - title: "Dominio de estrategias de comunicación con stakeholders"
        text: >-
          Identificar el orden, tipo de mensaje y momentos para comunicar con cada stakeholder las validaciones y puntos clave del proyecto.
