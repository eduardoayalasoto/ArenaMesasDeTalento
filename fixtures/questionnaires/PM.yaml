      - title: "Evaluación de impacto sistémico"
        text: >-
          Evaluar impacto y sinergias en otras iniciativas, equipos o capacidades y comunicar a otros equipos para lograr una mejor ejecución y entrega.
      - title: "Definición y defensa de límites de alcance"
        text: >-
          Establecer y sostener claramente el alcance del proyecto en los momentos donde haya negociaciones respecto a los entregables, equipo y tiempos del proyecto.
      - title: "Reencuadre de problemas del cliente"
        text: >-
          Cuestionar el problema que el equipo interno o el cliente busca solucionar cuando las actividades no atacan la causa raíz.
      - title: "Intervención temprana en riesgos"
        text: >-
          Anticipar, comunicar y actuar ante señales tempranas de riesgo involucrando a equipo interno de Arena y al cliente.
      - title: "Transferencia de criterio al equipo"
        text: >-
          Elevar el nivel de decisión del equipo mediante coaching.
      - title: "Posicionamiento como asesor de confianza con stakeholder"
        text: >-
          Desarrollar una relación de confianza, cercanía y apoyo con los stakeholders clave a través de los one on ones del proyecto.
      - title: "Autonomía en la gestión y ejecución del proyecto"
        text: >-
          Ejecutar y entregar el proyecto durante períodos largos sin requerir apoyo o presencia constante del equipo directivo, manteniendo tiempo, calidad y confianza.
      - title: "Cumplimiento lineamientos de trabajo remoto"
        text: >-
          Asistir y mantenerse enfocado en las reuniones.
      - title: "Cumplimiento lineamientos de trabajo remoto"
