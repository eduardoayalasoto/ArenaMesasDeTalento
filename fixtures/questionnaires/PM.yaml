templates:
  - area: PM
    level: JR
    questions:
      - title: "Documentación del plan y del avance"
        text: >-
          Mantener un plan de trabajo a nivel fase, actividad, entregable, responsable, día, semana. Identificando dependencias del cliente de acuerdo con los estándares de la Oficina de PMO de Arena y del cliente.
      - title: "Documentación del plan y del avance"
        text: >-
          Mantener un backlog o inventario con la lista de features o entregables ordenados por prioridad y validados con el equipo interno y el cliente en cada sesión de acuerdo con los estándares de la Oficina de PMO de Arena y del cliente.
      - title: "Documentación del plan y del avance"
        text: >-
          Documentar actividades completadas cada día y semana por cada uno de los miembros del equipo de Arena y del cliente de acuerdo con los estándares de la Oficina de PMO de Arena y del cliente.
      - title: "Documentación del plan y del avance"
        text: >-
          Generar reportes de avance semanales incluyendo fecha del reporte, número de semana, semáforo de status, done/inprogress/todo/blockers-riesgos, siguientes milestones, vista gráfica del plan de trabajo.
      - title: "Documentación del plan y del avance"
        text: >-
          Documentar y enviar por escrito (correo + chat grupal + chat individual) el detalle de ajustes al plan, riesgos, retrasos y cambios al alcance en comparación con la propuesta inicial.
      - title: "Documentación del plan y del avance"
        text: >-
          Validar, documentar y compartir al resto del equipo los estándares de trabajo, desarrollo y documentación requeridos por el cliente.
      - title: "Documentación del plan y del avance"
        text: >-
          Actualizar indicadores de avance y resultado del proyecto (e.g. % de avance real vs plan, % de actividades completadas, indicadores de negocio como precisión, error, etc.) de acuerdo con los estándares de la Oficina de PMO de Arena y del cliente.
      - title: "Documentación del plan y del avance"
        text: >-
          Mantener una estructura de canal y archivos en Teams, donde todo el equipo trabaja sobre archivos guardados en esa estructura, ningún archivo del proyecto se encuentra en un drive personal y se alinea con las expectativas y necesidades de los clientes.
      - title: "Rutinas de gestión"
        text: >-
          Asegurar dailys recurrentes agendados.
      - title: "Rutinas de gestión"
        text: >-
          Ejecutar weekly status reports con cliente técnico y de negocio.
      - title: "Rutinas de gestión"
        text: >-
          Asegurar sprint plan agendados y documentados con minuta, pre-work y ajustes al plan.
      - title: "Rutinas de gestión"
        text: >-
          Asegurar sprint review agendados y documentados con minuta, pre-work y ajustes al plan.
      - title: "Rutinas de gestión"
        text: >-
          Asegurar sprint retrospective agendados y documentados con minuta, pre-work y ajustes al plan o esquema de trabajo.
      - title: "Rutinas de gestión"
        text: >-
          Agendar refinamientos cada vez que exista un ajuste al backlog de actividades, al plan de trabajo o al alcance y entregables del proyecto o iniciativa.
      - title: "Cuestionamiento y validación de resultados"
        text: >-
          Contar con diseños de solución a nivel técnico. Revisados y validados por el PM para asegurar calidad y con signoff de lead técnico de Arena y lead técnico del cliente.
      - title: "Cuestionamiento y validación de resultados"
        text: >-
          Contar con diseños de solución a nivel negocio y definiciones. Revisados y validados por el PM para asegurar calidad.
      - title: "Cuestionamiento y validación de resultados"
        text: >-
          Generar presentaciones de revisión y validación de resultados y entregas con cliente técnico y de negocio.
      - title: "Preparación de reuniones y seguimiento con el cliente"
        text: >-
          Preparar reuniones internas y con el cliente que aseguren que todo el equipo de Arena está listo para llevar la sesión o participar en ella de forma exitosa y contundente.
      - title: "Preparación de reuniones y seguimiento con el cliente"
        text: >-
          Agendar sesiones one on one de retroalimentación para identificar la percepción de calidad y sugerencias de mejora del cliente.
      - title: "Preparación de reuniones y seguimiento con el cliente"
        text: >-
          Comunicar por mensaje individual o chat grupal avisando del avance, de los puntos críticos para asegurar que todos los stakeholders involucrados tienen la visibilidad del avance.
      - title: "Seguimiento a acuerdos y definiciones de las sesiones"
        text: >-
          Enviar pre-reads para sesiones internas y con clientes.
      - title: "Seguimiento a acuerdos y definiciones de las sesiones"
        text: >-
          Documentar y enviar minutas con validaciones, definiciones, acuerdos y cambios de alcance o plan.
      - title: "Seguimiento a acuerdos y definiciones de las sesiones"
        text: >-
          Documentar y enviar minutas con las mejoras y ajustes relevantes a realizar según los checkpoint y retro de cliente.
      - title: "Cumplimiento lineamientos de trabajo remoto"
        text: >-
          Asistir y mantenerse enfocado en las reuniones.
      - title: "Cumplimiento lineamientos de trabajo remoto"
        text: >-
          Responder correos y mensajes por Teams en tiempo y forma.
