source: docs/Checklists/Versión 2027/Checklist de Actividades Product Management - Octubre 2026.xlsx
templates:
- area: PM
  level: JR
  questions:
  - title: Documentación del plan y del avance — Plan de trabajo
    text: Mantener un plan de trabajo a nivel fase, actividad, entregable, responsable, día, semana. Identificando dependencias del cliente de acuerdo con los estándares de la Oficina de PMO de Arena y del cliente
    acceptance_criteria: Existe un plan actualizado con lo descrito en este checklist que el equipo de Arena y el cliente pueden revisar en cualquier momento y ver la versión más actualizada
    deliverable: Plan de trabajo con control de versiones por cada cambio mayor
    deliverable_format: XLS, Arena OS
    frequency: Semanal
    guidance: Si el cliente requiere un plan de trabajo documentado en su formato o herramienta, esta versión puede ser utilizada siempre y cuando cumpla con la descripción completa y criterio de aceptación descritos en este checklist
  - title: Documentación del plan y del avance — Backlog de features y entregables
    text: Mantener un backlog o inventario con la lista de features o entregables ordenados por prioridad y validados con el equipo interno y el cliente en cada sesión de acuerdo con los estándares de la Oficina de PMO de Arena y del cliente
    acceptance_criteria: Existe un backlog actualizado con lo descrito en este checklist que el equipo de Arena y el cliente pueden revisar en cualquier momento y ver la versión más actualizada
    deliverable: Backlog con control de versiones por cada cambio mayor
    deliverable_format: XLS, Arena OS
    frequency: Cada sprint
  - title: Documentación del plan y del avance — Registro de actividades del equipo
    text: Documentar actividades completadas cada día y semana por cada uno de los miembros del equipo de Arena y del cliente de acuerdo con los estándares de la Oficina de PMO de Arena y del cliente
    acceptance_criteria: Existe un documento donde se puede visualizar el set de tareas completadas por tema, fecha y miembro del equipo (e.g. presentación de avance semana, presentación de sprint review)
    deliverable: Durante el proyecto se lleva una métrica documentada cada semana y sprint de las actividades completadas por cada miembro del equipo
    deliverable_format: XLS, Arena OS
    frequency: Semanal y cada sprint
  - title: Documentación del plan y del avance — Reporte semanal de avance
    text: Generar reportes de avance semanales incluyendo fecha del reporte, número de semana, semáforo de status, done/inprogress/todo/blockers-riesgos, siguientes milestones, vista gráfica del plan de trabajo
    acceptance_criteria: El cliente y el equipo de Arena tienen claro el panorama general cada semana del avance y actividades principales sin tener que ir a ver el mayor nivel de detalle al plan
    deliverable: Documentos semanales de avance
    deliverable_format: PPT, PDF, Arena OS
    frequency: Semanal
    guidance: El formato del reporte de avance se validará con el cliente y ajustará según su retro durante las primeras 4 semanas de la iniciativa o proyecto
  - title: Documentación del plan y del avance — Comunicación de ajustes al plan
    text: Documentar y enviar por escrito (correo + chat grupal + chat individial) el detalle de ajustes al plan, riesgos, retrasos y cambios al alcance en comparación con la propuesta inicial
    acceptance_criteria: Cada ajuste de alcance, cambio de prioridades, ajuste al plan o retarget de entregable está documentado y comunicado claramente por escrito
    deliverable: Correos, Histórico de chats con los avisos y validaciones correpsondientes
    deliverable_format: Mail, Teams, Arena OS
    frequency: Por evento
    guidance: Las minutas también pueden ser consideradas como evidencia de ejecución de este punto
  - title: Documentación del plan y del avance — Estándares de trabajo
    text: Validar, documentar y compartir al resto del equipo los estándares de trabajo, desarrollo y documentación requeridos por el cliente
    acceptance_criteria: El equipo del proyecto tiene claro cómo debe entregar sus desarrollos y qué reglas y evaluaciones recibirá antes de entregar el proyecto
    deliverable: Ligas o documentos con los estándares a seguir en el proyecto, documentados y validados con cliente, en minuta
    deliverable_format: Mail, Teams, PPT/PDF
    frequency: Una vez al inicio del proyecto y confirmado con cada fase de entregas
    guidance: En caso de no existir un estándar, el equipo interno deberá validar uno propuesto por Arena y documentar por correo que ese será el estándar a utilizar en el proyecto. En caso de cambiar el estándar durante el proyecto, esto debe ser notificado internamente y con cliente, acompañado de una documentación del impacto de ese cambio
  - title: Documentación del plan y del avance — Indicadores del proyecto
    text: Actualizar indicadores de avance y resultado del proyecto (e.g. % de avance real vs plan, % de actividades completadas, indicadores de negocio como precisión, error, etc.) de acuerdo con los estándares de la Oficina de PMO de Arena y del cliente
    acceptance_criteria: Arena tiene un mecanismo para analizar el avance y desempeño del proyecto de forma rápida en un único punto de revisión
    deliverable: Archivo actualizado con indicadores
    deliverable_format: XLS, PPT/PD, Arena OS
    frequency: Semanal
    guidance: Se tomará el archivo de indicadores de KO como punto de partida
  - title: Documentación del plan y del avance — Estructura de canal y archivos
    text: Mantener una estructura de canal y archivos en teams, donde todo el equipo trabajo sobre archivos guardados en esa estructura, ningún archivo del proyecto se encuentra en un drive personal y se alinea con las expectativas y necesidades de los clientes
    acceptance_criteria: El equipo y los clientes pueden acceder fácilmente a archivos sin tener que intercambiar adjuntos por correo, la carpeta del proyecto tiene una estructura ordenada y los nombres de los archivos se identifican claramente
    deliverable: Canales en teams
    deliverable_format: Teams, Sharepoint
    frequency: Durante todo el proyecto
  - title: Rutinas de gestión — Dailys
    text: Asegurar dailys recurrentes agendados
    acceptance_criteria: Las sesiones duran 15 - 20 mins, el equipo está preparado previo a la sesión y los comentarios y validaciones están enfocados a tareas específicas por día y persona
    deliverable: Sesiones agendadas y ejecutadas y documentadas individualmente según lo especificado en este documento
    deliverable_format: Calendario, Chat, Arena OS
    frequency: Diaria
  - title: Rutinas de gestión — Weekly status reports
    text: Ejecutar weekly status reports con cliente técnico y de negocio
    acceptance_criteria: El equipo tiene una rutina donde el cliente se queda con la tranquilidad y certidumbre de lo que estamos trabajando y si salen pendientes o actividades, éstos se documentan y ejecutan en tiempo y forma. El PM muestra un dominio del plan, de la solución y puede responder ante dudas y cuestionamientos de forma contundente
    deliverable: Sesiones agendadas y ejecutadas y documentadas individualmente según lo especificado en este documento
    deliverable_format: Calendario, Minuta, Arena OS
    frequency: Por sprint
  - title: Rutinas de gestión — Sprint planning
    text: Asegurar sprint plan agendados y documentados con minuta, pre-work y ajustes al plan
    acceptance_criteria: Cada miembro del equipo sale con la claridad de los entregables por día que debe ejecutar, su criterio de aceptación y definición de terminado, así como las actualizaciones a los planes correspondientes
    deliverable: Sesiones agendadas y ejecutadas y documentadas individualmente según lo especificado en este documento
    deliverable_format: Calendario, Minuta, Arena OS
    frequency: Por sprint
    guidance: Los sprints deberán ser de 2 semanas, en momentos específicos podrán ser de 1 o 3 semanas
  - title: Rutinas de gestión — Sprint review
    text: Asegurar sprint review agendados y documentados con minuta, pre-work y ajustes al plan
    acceptance_criteria: El equipo documenta y valida cada uno de los entregables internamente y con el cliente, documentando siguientes pasos y tareas a incluir
    deliverable: Sesiones agendadas y ejecutadas y documentadas individualmente según lo especificado en este documento
    deliverable_format: Calendario, Minuta, Arena OS
    frequency: Por sprint
    guidance: Los sprints deberán ser de 2 semanas, en momentos específicos podrán ser de 1 o 3 semanas
  - title: Rutinas de gestión — Sprint retrospective
    text: Asegurar sprint retrospective agendados y documentados con minuta, pre-work y ajustes al plan o esquema de trabajo
    acceptance_criteria: El equipo tiene un espacio para expresar sus preocupaciones, sugerencias de mejora y continuar con un buen ambiente de trabajo
    deliverable: Sesiones agendadas y ejecutadas y documentadas individualmente según lo especificado en este documento
    deliverable_format: Calendario, Minuta, Arena OS
    frequency: Por evento
    guidance: Se recomienda llevar las mediciones de retrospectiva base de la metodología Scrum
  - title: Rutinas de gestión — Refinamientos
    text: Agendar refinamientos cada vez que exista un ajuste al backlog de actividades, al plan de trabajo o al alcance y entregables del proyecto o iniciativa
    acceptance_criteria: El equipo interno tiene claridad de las implicaciones y ajustes en sus actividades individuales cuando existen cambios al alcance, a las prioridades, al backlog, a los estándares de trabajo o al plan de trabajo del proyecto
    deliverable: Sesiones agendadas y ejecutadas y documentadas individualmente según lo especificado en este documento
    deliverable_format: Calendario, Minuta, Arena OS
    frequency: Por evento, cada cambio al alcance, backlog, plan de trabajo o estándar de trabajo
  - title: Cuestionamiento y validación de resultados — Diseño de solución técnico
    text: Contar con diseños de solución a nivel técnico. Revisados y validados por el PM para asegurar calidad y con signoff de lead técnico de Arena y lead técnico del cliente
    acceptance_criteria: El cliente técnico y el cliente de negocio tienen claro lo que estamos construyendo y existe una aprobación documentada. El equipo de Arena tiene una guía clara del objetivo a desarrollar
    deliverable: Diseño de la solución documentado y versionado
    deliverable_format: PPT/PDF
    frequency: Por evento, al menos cada sprint
    guidance: Los diseños deberán tener el mayor nivel de detalle posible, agregando diagramas, descripciones detalladas, explicaciones escritas y otros elementos de soporte
  - title: Cuestionamiento y validación de resultados — Diseño de solución de negocio
    text: Contar con diseños de solución a nivel negocio y definiciones. Revisados y validados por el PM para asegurar calidad
    acceptance_criteria: El cliente técnico y el cliente de negocio tienen claro lo que estamos construyendo y existe una aprobación documentada. El equipo de Arena tiene una guía clara del objetivo a desarrollar
    deliverable: Diseño de la solución documentado y versionado
    deliverable_format: PPT/PDF
    frequency: Por evento, al menos cada sprint
    guidance: Los diseños deberán tener el mayor nivel de detalle posible, agregando diagramas, descripciones detalladas, explicaciones escritas y otros elementos de soporte
  - title: Cuestionamiento y validación de resultados — Presentaciones de resultados
    text: Generar presentaciones de revisión y validación de resultados y entregas con cliente técnico y de negocio
    acceptance_criteria: El cliente no hace correcciones recurrentes que pudieron haber sido identificadas anteriormente por el equipo y por el PM, los resultados tienen pocos retrabajos y las sesiones de revisión con cliente no terminan rápidamente por identificar múltiples errores en los primeros minutos
    deliverable: Presentaciones elaboradas, retrabajos documentados y percepción del cliente registrada
    deliverable_format: PPT/PDF
    frequency: Por sprint
  - title: Preparación de reuniones y seguimiento con el cliente — Preparación de reuniones
    text: Preparar reuniones internas y con el cliente que aseguren que todo el equipo de Arena está listo para llevar la sesión o participar en ella de forma exitosa y contundente
    acceptance_criteria: El equipo llega siempre con material a las sesiones, llega con respuestas preparadas ante posibles dudas y en general el cliente percibe un excelente dominio y preparación de la sesión
    deliverable: XLS con la documentación de cada reunión planeada
    deliverable_format: XLS Formato Prep Reuniones
    frequency: Obligatorio para cada reunión agendada
    guidance: Se espera que el formato de preparación de reuniones se llene al menos un día hábil antes de la sesión y que se llene con juicio crítico y detenimiento. De este ejercicio deben resultar acciones individuales y para el resto del equipo que aseguren tener una preparación correcta de cómo llevar y participar en cada sesión, especialmente con cliente
  - title: Preparación de reuniones y seguimiento con el cliente — One on ones de retroalimentación
    text: Agendar sesiones one on one de retroalimentación para identificar la percepción de calidad y sugerencias de mejora del cliente
    acceptance_criteria: El cliente siente cercanía y confianza para expresar sus recomendaciones de mejora, alineamos expectativas de lo que puede lograr el equipo y el cliente identifica mejoras tangibles en función a sus comentarios. La retroalimentación se registra y analiza consistentemente por el equipo de Arena
    deliverable: Evidencia de retroalimentación y registro del feedback recibido
    deliverable_format: Mail, Chat, Calendario, Arena OS
    frequency: Por evento, al menos cada 3 - 4 semanas
  - title: Preparación de reuniones y seguimiento con el cliente — Comunicación de avance y puntos críticos
    text: Comunicar por mensaje individual o chat grupal avisando del avance, de los puntos críticos para asegurar que todos los stakeholders involucrados tienen la visibilidad del avance
    acceptance_criteria: El cliente (todo el grupo de stakeholders relevantes) puede mantenerse actualizado sin necesidad de esperar a la comunicación formal de minutas y pre-reads a través de mensajes cortos, resumidos y claros
    deliverable: Evidencia de los mensajes directos en chat invidual o grupal
    deliverable_format: Chat
    frequency: 2 - 3 veces por semana
  - title: Seguimiento a acuerdos y definiciones de las sesiones — Pre-reads
    text: Enviar pre-reads para sesiones internas y con clientes
    acceptance_criteria: El cliente recibe el material con anticipación, damos seguimiento por chat a posibles dudas o comentarios que debamos llevar preparados para la sesión y llegamos a las sesiones a resolver cuestionamientos identificados
    deliverable: Correos con las presentaciones enviadas al menos 24 hrs antes de la sesión
    deliverable_format: Mail, Material de Pre-read
    frequency: Por evento, al menos una vez cada semana
  - title: Seguimiento a acuerdos y definiciones de las sesiones — Minutas de acuerdos y definiciones
    text: Documentar y enviar minutas con validaciones, definiciones, acuerdos y cambios de alcance o plan
    acceptance_criteria: Las minutas son claras, concisas, no tienen errores de ortografía y el cliente las entiende claramente según el feedback recabado
    deliverable: Correos enviados con minutas y/o minutas adjuntas
    deliverable_format: Mail
    frequency: Por evento, al menos una vez por semana
    guidance: Se espera claridad y alineación con el Ejemplo de Minuta mostrado en este documento. Si es necesario en el correo o mensaje con la minuta se pueden agregar la liga o adjunto a material de consulta como PPT/XLS
  - title: Seguimiento a acuerdos y definiciones de las sesiones — Minutas de mejoras y ajustes
    text: Documentar y enviar minutas con las mejoras y ajustes relevantes a realizar según los checkpoint y retro de cliente
    acceptance_criteria: Las minutas son claras, concisas, no tienen errores de ortografía y el cliente las entiende claramente según el feedback recabado
    deliverable: Correos enviados con minutas y/o minutas adjuntas
    deliverable_format: Mail
    frequency: Por evento, al menos cada 3 - 4 semanas
    guidance: Se espera claridad y alineación con el Ejemplo de Minuta mostrado en este documento. Si es necesario en el correo o mensaje con la minuta se pueden agregar la liga o adjunto a material de consulta como PPT/XLS
  - title: Estimación y cumplimiento de plazos
    text: Capacidad para estimar de manera realista el tiempo que requieren sus tareas, cumplir los plazos comprometidos y avisar oportunamente cuando alguno esté en riesgo.
    acceptance_criteria: '• Llega al sprint planning con estimaciones propias de sus tareas, después de revisar el backlog y los criterios de aceptación.

      • Cumple las fechas que compromete. Cuando no, la desviación es menor y está justificada.

      • Avisa en el daily, o antes, en cuanto detecta que una tarea tomará más de lo estimado, y no el día de la entrega.

      • Cuando le falta información para estimar, pide aclaración o divide la tarea en lugar de dar un número al azar.

      • Si no puede responder en 24 horas, confirma que recibió el mensaje e indica cuándo tendrá la respuesta.'
    frequency: Continua, durante todo el periodo de evaluación.
    guidance: 'Los indicadores describen el nivel “Cumple” (3) y son acumulativos: cada nivel incluye lo esperado en el anterior. “Excede” (4) = demuestra de forma consistente indicadores del siguiente nivel.'
  - title: Apertura y aplicación de la retroalimentación
    text: Capacidad para recibir la retroalimentación con apertura y sin actitud defensiva, e incorporarla tanto en el trabajo en curso como en proyectos futuros, demostrando adaptabilidad y mejora continua.
    acceptance_criteria: '• Recibe la retroalimentación sin ponerse a la defensiva: escucha, pregunta para entender y reconoce el punto.

      • Corrige lo señalado en el entregable actual dentro del plazo acordado.

      • No repite en entregables posteriores un error que ya se le señaló.

      • Pide revisión a su Mid o Sr antes de dar un entregable por terminado.

      • Registra la retroalimentación recibida y sus acuerdos en sus checkpoints o 1:1.'
    frequency: Continua, durante todo el periodo de evaluación.
    guidance: 'Los indicadores describen el nivel “Cumple” (3) y son acumulativos: cada nivel incluye lo esperado en el anterior. “Excede” (4) = demuestra de forma consistente indicadores del siguiente nivel.'
