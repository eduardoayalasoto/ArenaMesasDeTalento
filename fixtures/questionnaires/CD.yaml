templates:
  - area: CD
    level: JR
    questions:
      - title: "Backlog de tareas"
        text: >-
          Mantener un backlog de tareas de sus actividades, confirmando prioridades, expectativas de tiempo de entrega y dependencias (técnicas y operativas) de acuerdo con los estándares de la Oficina de PMO.
      - title: "Documentación del avance"
        text: >-
          Actualizar y documentar el avance de sus tareas en la herramienta de seguimiento correspondiente y de acuerdo con los estándares de la Oficina de PMO. Incluir riesgos, dependencias y bloqueos activos.
      - title: "Documentación de los estándares de desarrollo y buenas prácticas"
        text: >-
          Revisar, entender y aplicar los estándares de desarrollo y documentación vigentes para el proyecto desde el inicio del mismo.
      - title: "Diseño de arquitectura de datos"
        text: >-
          Entender y documentar el diseño de arquitectura definido por el DS Sr/Lead y aplicarlo correctamente en sus desarrollos. Identificar cuando sus implementaciones se desvían del diseño acordado y comunicarlo de inmediato.
      - title: "Excelencia técnica de métodos estadísticos"
        text: >-
          Implementar, ejecutar y darle seguimiento, con una base teórica sólida y siguiendo las buenas prácticas del trabajo estadístico, a las distintas pruebas (paramétricas o no), planes de muestreo, pruebas de hipótesis y modelación matemática que requiera el producto, validando cuidadosamente los supuestos empleados en cada caso.
      - title: "Funcionalidad óptima de código y excelencia técnica en programación"
        text: >-
          Realizar, de manera óptima y de acuerdo con las pautas (técnicas y de infraestructura) establecidas en el proyecto, el código que ejecute la solución (o una parte de ella) asignada por el DS Mid, siguiendo las buenas prácticas y los más altos estándares de calidad en su programación.
      - title: "Documentación de reglas de negocio"
        text: >-
          Entender las reglas de negocio definidas y validar que sus implementaciones las incorporan correctamente. Levantar dudas sobre la aplicación de una regla antes de codificarla.
      - title: "Rutinas de gestión y control interno 1"
        text: >-
          Asistir al daily preparado, comunicando claramente el avance de sus actividades, bloqueos, dependencias y riesgos. No llegar al daily a descubrir sus propios bloqueos: deben estar identificados antes de la sesión.
      - title: "Rutinas de gestión y control interno 2"
        text: >-
          Asistir al touchpoint o one-on-one interno con el DS Lead/Mid comunicando proactivamente los puntos más críticos de sus actividades, dudas técnicas y personales, y compromisos del período.
      - title: "Rutinas de gestión y control interno 3"
        text: >-
          Asistir al sprint planning preparado, con una propuesta propia de sus actividades, estimaciones de tiempo, criterios de aceptación y dependencias relevantes para el sprint.
      - title: "Rutinas de gestión y control interno 4"
        text: >-
          Asistir al sprint review y retro preparado, exponiendo los resultados de sus tareas, aprendizajes del sprint y áreas de mejora concretas. Recibir feedback sin ponerse a la defensiva.
      - title: "Checklist de validaciones"
        text: >-
          Ejecutar y documentar las validaciones técnicas de cada entregable antes de considerarlo completo. No declarar una tarea como 'done' sin haber ejecutado el checklist correspondiente.
      - title: "Plan de deployment y roll-out"
        text: >-
          Entender el plan de despliegue definido y ejecutar las actividades de deployment asignadas siguiendo los lineamientos del DS Sr/Lead. Comunicar cualquier incidente o desviación durante el roll-out de forma inmediata.
      - title: "Minuta de reuniones con Negocio"
        text: >-
          Apoyar en el registro de acuerdos, definiciones y peticiones de Negocio (relacionadas con Ciencia de Datos) durante sesiones donde participe. Garantizar que los acuerdos relevantes para sus tareas están capturados correctamente.
      - title: "Checklist de documentación y revisiones de código"
        text: >-
          Documentar el código desarrollado siguiendo las buenas prácticas definidas por Arena y los requerimientos de Negocio. La documentación es parte del entregable, no un paso opcional al final.
      - title: "Plan de KT y legacy"
        text: >-
          Ejecutar las sesiones de KT asignadas a su nivel, garantizando que Negocio puede operar los desarrollos del DS Jr de forma autónoma después del cierre del proyecto.
      - title: "Resumen de herramientas y necesidades técnicas"
        text: >-
          Comunicar proactivamente sus necesidades técnicas, de capacitación y accesos requeridos para ejecutar su trabajo en cada sprint. No esperar a que le pregunten si tiene todo lo que necesita.
      - title: "Preparación y participación en sesiones con Negocio"
        text: >-
          Prepararse para cada sesión con Negocio anticipando preguntas técnicas que puedan surgir sobre los desarrollos bajo su responsabilidad. Llevar respuestas preparadas, no improvisar en sesión.
      - title: "Cumplimiento de lineamientos de trabajo remoto 1"
        text: >-
          Confirmar asistencia a reuniones, conectarse de forma puntual, prender cámara y mantenerse atento y participativo durante toda la sesión.
      - title: "Cumplimiento de lineamientos de trabajo remoto 2"
        text: >-
          Responder correos y mensajes de Teams en tiempo y forma, dentro de las 24 horas hábiles de haberlos recibido.
