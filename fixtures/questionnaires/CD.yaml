  - area: CD
    level: SNR
    questions:
      - title: "Backlog de tareas"
        text: >-
          Definir y mantener el backlog técnico del equipo de Ciencia, incluyendo deuda técnica, entrenamiento/reentrenamiento de modelos, métricas, sesgo, anomalías y validaciones. Asegurar que el backlog está priorizado de acuerdo con el valor al cliente y la viabilidad técnica, no solo con la urgencia operativa.
      - title: "Documentación del avance"
        text: >-
          Coordinar con el DS Mid la distribución de tareas del sprint y asegurar que el plan refleja las fases de diseño y modelación con el nivel de detalle necesario. Detectar riesgos estructurales del sprint antes de que ocurran.
      - title: "Documentación de los estándares de desarrollo y buenas prácticas"
        text: >-
          Definir, validar y asegurar la correcta aplicación de estándares de trabajo, desarrollo y buenas prácticas en todos los entregables del equipo de Ciencia. Resolver conflictos entre los estándares de Arena y los requerimientos de Negocio con criterio técnico documentado.
      - title: "Diseño de arquitectura de datos"
        text: >-
          Diseñar, documentar y validar con DE y Producto la arquitectura de datos necesaria para el despliegue de soluciones en ambiente productivo. Comunicar explícitamente los componentes que no existen en el ecosistema de Negocio o que implican costos adicionales.
      - title: "Excelencia técnica de métodos estadísticos"
        text: >-
          Diseñar, coordinar, implementar, ejecutar, evaluar y criticar, con bases teóricas sólidas y buenas prácticas del trabajo estadístico, todos los aspectos matemáticos o estadísticos (modelos, pruebas de hipótesis, pruebas, muestreo, etc.) que requiera el producto, validando cuidadosamente los supuestos que defina o elija en cada caso.
      - title: "Funcionalidad óptima de código y excelencia técnica en programación"
        text: >-
          Diseñar, asignar y supervisar, apegado a las buenas prácticas y requerimientos (técnicos y de staff) establecidos en el proyecto, el pseudocódigo y los algoritmos que resuelven el problema de negocio. Dependiendo de la naturaleza del proyecto, le da seguimiento a la integración de pipelines, soluciones de GenAI, modelos de analítica avanzada y POC, cerciorándose de su correcto funcionamiento, mantenimiento, accesibilidad y escalabilidad.
      - title: "Documentación de reglas de negocio"
        text: >-
          Definir y validar con Negocio y Producto las reglas de negocio dentro de los supuestos estadísticos del proyecto. Supervisar su correcta implementación en el pipeline y gestionar la deprecación de reglas que pierdan vigencia.
      - title: "Rutinas de gestión y control interno 1"
        text: >-
          Asistir al daily reportando su avance en definición, coordinación y validación. Identificar y anticipar riesgos del sprint como principal responsable de la gestión de riesgos técnicos del equipo de Ciencia.
      - title: "Rutinas de gestión y control interno 2"
        text: >-
          Asistir al touchpoint semanal con el DS Lead preparado con updates de proyectos, riesgos técnicos, plan de mentoring y compromisos del período. En ausencia del DS Lead, asumir la conducción del touchpoint.
      - title: "Rutinas de gestión y control interno 3"
        text: >-
          Asistir al touchpoint con los Leads de DE y Producto representando al equipo de Ciencia con criterio propio. En ausencia del DS Lead, ser el vocero del equipo y documentar los acuerdos inter-equipo.
      - title: "Rutinas de gestión y control interno 4"
        text: >-
          Liderar el sprint planning definiendo qué ejecutará, coordinará y validará durante el sprint. Hacer challenge de las actividades del equipo que no estén alineadas, no sean realistas o tengan definiciones incompletas.
      - title: "Rutinas de gestión y control interno 5"
        text: >-
          Exponer su desempeño en el sprint review y retro, identificar áreas de mejora propias y del equipo, y proponer cambios concretos para el siguiente sprint. Dar retroalimentación técnica profunda al DS Mid.
      - title: "Rutinas de gestión y control interno 6"
        text: >-
          Liderar el biweekly de datos con Negocio mostrando supuestos estadísticos, reglas de negocio, benchmark entre modelos y arquitectura del producto de datos. Validar supuestos con Negocio y documentar acuerdos.
      - title: "Rutinas de gestión y control interno 7"
        text: >-
          Supervisar y coordinar las ceremonias de actualización al backlog, asegurando que cualquier redistribución de trabajo esté validada técnicamente y sea realista para el equipo disponible.
      - title: "Checklist de validaciones"
        text: >-
          Definir los criterios de validación estadística del sprint, incluyendo horizontes de reentrenamiento, QA de modelos y arquitecturas de datos. Ser el árbitro final de la validez de un criterio de aceptación técnico.
      - title: "Plan de deployment y roll-out"
        text: >-
          Diseñar el plan de despliegue y respuesta a contingencias del equipo de Ciencia. Asesorar al DS Mid y DS Jr sobre el plan de roll-back. Asegurarse de que el plan está alineado con los tiempos de Producto y Negocio.
      - title: "Minuta de reuniones con Negocio"
        text: >-
          Liderar sesiones técnicas con Negocio y asegurarse de que los acuerdos de alto impacto técnico están correctamente documentados. Revisar y aprobar internamente las minutas del DS Mid antes de compartirlas con Negocio.
      - title: "Checklist de documentación y revisiones de código"
        text: >-
          Definir los requisitos de documentación del proyecto según la expectativa de Negocio y las buenas prácticas de Arena. Hacer la revisión final de código y documentación antes del cierre del proyecto.
      - title: "Plan de KT y legacy"
        text: >-
          Definir y supervisar el plan de KT y legacy. Asegurar que la solución es escalable, mantenible y operable por Negocio. Participar en las sesiones de KT críticas con Negocio.
      - title: "Resumen de herramientas y necesidades técnicas"
        text: >-
          Anticipar y comunicar las necesidades técnicas del equipo de Ciencia a nivel de herramientas, licencias y capacidades. Supervisar el avance del plan de mentoring del DS Mid.
      - title: "Preparación y participación en sesiones con Negocio"
        text: >-
          Preparar y liderar sesiones con Negocio anticipando preguntas de alto nivel técnico y estratégico sobre los modelos y la arquitectura. Proponer el enfoque correcto cuando Negocio plantea una solución técnicamente inviable o subóptima.
      - title: "Cumplimiento de lineamientos de trabajo remoto 1"
        text: >-
          Confirmar asistencia a reuniones, conectarse de forma puntual, prender cámara y mantenerse atento y participativo durante toda la sesión.
      - title: "Cumplimiento de lineamientos de trabajo remoto 2"
        text: >-
          Responder correos y mensajes de Teams en tiempo y forma, dentro de las 24 horas hábiles de haberlos recibido.
  - area: CD
    level: LEAD
    questions:
      - title: "Aseguramiento de calidad técnica del equipo 1"
        text: >-
          Realizar seguimiento a los DS Sr/Mid de sus proyectos para evaluar el cumplimiento de sus checklists correspondientes. Documentar hallazgos y dar retro directa en sesión 1:1.
      - title: "Aseguramiento de calidad técnica del equipo 2"
        text: >-
          Asegurar que los proyectos a su cargo cumplen con las actividades de la Oficina de PMO y con los estándares técnicos de Arena. Identificar brechas y escalarlas al director de Analítica cuando no puedan resolverse a nivel de proyecto.
      - title: "Documentación de los estándares de desarrollo y buenas prácticas"
        text: >-
          Definir, validar y asegurar la correcta aplicación de estándares de trabajo, desarrollo y buenas prácticas en todos los entregables del equipo de Ciencia. Resolver conflictos entre los estándares de Arena y los requerimientos de Negocio con criterio técnico documentado.
      - title: "Guía y soporte al equipo de proyecto 1"
        text: >-
          Asistir y participar activamente en los dailys al inicio del proyecto, en fases de entregables críticos y en el cierre. Evaluar en cada asistencia la preparación del equipo, el foco y el cumplimiento de agenda y tiempos.
      - title: "Guía y soporte al equipo de proyecto 2"
        text: >-
          Asistir y participar activamente en los sprint planning y sprint review de los proyectos bajo su cargo. Hacer challenge técnico de estimaciones, definitions of completeness y alcance comprometido vs propuesta original.
      - title: "Guía y soporte al equipo de proyecto 3"
        text: >-
          Identificar, validar el material y participar en sesiones críticas con stakeholders senior del cliente que requieran apoyo del DS Lead. Asegurar que el equipo tiene clara la agenda, estructura y objetivo de la sesión antes de construir el material.
      - title: "Guía y soporte al equipo de proyecto 4"
        text: >-
          Ayudar al equipo a mapear, entender y gestionar a todos los stakeholders involucrados en el proyecto, incluyendo sus motivaciones, nivel de influencia y postura hacia el proyecto.
      - title: "Guía y soporte al equipo de proyecto 5"
        text: >-
          Agendar y ejecutar one-on-ones con stakeholders senior del cliente para alinear expectativas, detectar señales tempranas de insatisfacción y generar una relación de confianza y cercanía.
      - title: "Guía y soporte al equipo de proyecto 6"
        text: >-
          Anticipar y coordinar la participación del director de Analítica en momentos y sesiones críticas del proyecto, comunicando con claridad el contexto, la situación y el tipo de apoyo requerido.
      - title: "Guía y soporte al equipo de proyecto 7"
        text: >-
          Crear y ejecutar un plan de transición, onboarding, KT y seguimiento al staffing del proyecto al inicio, durante y al final, considerando riesgos de rotación y continuidad técnica.
      - title: "Guía y soporte al equipo interno 1"
        text: >-
          Asegurar que los proyectos a su cargo cumplen con las actividades correspondientes a la Mesa de Talento, incluyendo evaluaciones de desempeño y cierre de evaluaciones antes de que el equipo se mueva a otros proyectos.
      - title: "Guía y soporte al equipo interno 2"
        text: >-
          Monitorear y dar seguimiento al avance de los planes de capacitación del equipo de Ciencia en sus proyectos. Identificar quién no ha podido avanzar por carga de trabajo y escalar al director de Analítica cuando sea necesario.
      - title: "Guía y soporte al equipo interno 3"
        text: >-
          Monitorear la ejecución y calidad de las sesiones de mentoring de los DS Sr/Mid en sus proyectos. Identificar quién no está haciendo mentoring efectivo a su cargo y actuar sobre ello.
      - title: "Guía y soporte al equipo interno 4"
        text: >-
          Dar seguimiento a la planeación y anticipación de los días de vacaciones y ausencias del equipo de Ciencia en sus proyectos para evitar riesgos en la ejecución de entregables críticos.
      - title: "Guía y soporte al equipo interno 5"
        text: >-
          Ser el punto de referencia para resolver dudas de los procedimientos internos de Arena (PMO, Odoo, Mesa de Talento, vacaciones, etc.) para el equipo de Ciencia bajo su cargo.
      - title: "Guía y soporte al equipo interno 6"
        text: >-
          Planear y ejecutar sesiones de aprendizaje técnico con el equipo de Ciencia. Diseñar sesiones que desarrollen habilidades técnicas o de consultoría del equipo, dejando al equipo con aprendizajes concretos y aplicables.
      - title: "Guía y soporte al equipo interno 7"
        text: >-
          Identificar y gestionar la implementación de mejoras a las metodologías, estándares de trabajo y herramientas del equipo de Ciencia, en coordinación con el resto de los leads y el director de Analítica.
      - title: "Soporte comercial 1"
        text: >-
          Dar soporte comercial a través de la identificación de oportunidades de expansión, necesidades no cubiertas del cliente, evolución de soluciones actuales y sensibilización en temas de innovación en data science y analytics.
      - title: "Soporte comercial 2"
        text: >-
          Dar soporte comercial a través de la construcción y validación técnica de propuestas en conjunto con otros leads y el director de Analítica.
      - title: "Soporte comercial 3"
        text: >-
          Dar soporte comercial a través del seguimiento a facturación y temas administrativos del proyecto cuando sea requerido por el director.
      - title: "Soporte comercial 4"
        text: >-
          Coordinar y tener sesiones presenciales en las oficinas del cliente o de Arena para desarrollar una relación más cercana y mantener una presencia activa de Arena con el cliente.
      - title: "Cumplimiento de lineamientos de trabajo remoto 1"
        text: >-
          Confirmar asistencia a reuniones, conectarse de forma puntual, prender cámara y mantenerse atento y participativo durante toda la sesión.
      - title: "Cumplimiento de lineamientos de trabajo remoto 2"
        text: >-
          Responder correos y mensajes de Teams en tiempo y forma, dentro de las 24 horas hábiles de haberlos recibido.
