{% comment %}Tarjeta de pilar. Params: title, score (Decimal|None), weight (Decimal|None).{% endcomment %}
<div class="bg-base-100 border border-base-300 rounded-2xl shadow-sm p-5">
  <p class="text-base text-base-content/60">{{ title }}</p>
  <p class="mt-1 text-3xl font-semibold text-base-content tabular-nums">{{ score|default:"—" }}</p>
  {% if weight %}<p class="mt-1 text-base text-base-content/60">Peso en tu nivel: {% widthratio weight 1 100 %}%</p>{% endif %}
  <div class="mt-3 h-2 rounded-full bg-base-200 overflow-hidden">
    <div class="h-full bg-primary" style="width: {% if score %}{% widthratio score 4 100 %}{% else %}0{% endif %}%"></div>
  </div>
</div>
