{% comment %}Tarjeta de estadística con icono. Params: icon, label, value, tone (arena|emerald|amber|rose).{% endcomment %}
<div class="bg-base-100 border border-base-300 rounded-2xl shadow-sm p-5 flex items-center gap-4">
  <span class="grid place-items-center w-11 h-11 rounded-xl shrink-0
    {% if tone == 'emerald' %}bg-success/10 text-success
    {% elif tone == 'amber' %}bg-warning/10 text-warning
    {% elif tone == 'rose' %}bg-error/10 text-error
    {% else %}bg-primary/10 text-primary{% endif %}">
    {% include "partials/icon.html" with name=icon cls="w-5 h-5" %}
  </span>
  <div class="min-w-0">
    <p class="text-2xl font-bold text-base-content tabular-nums leading-tight">{{ value }}</p>
    <p class="text-base text-base-content/60 truncate">{{ label }}</p>
  </div>
</div>
