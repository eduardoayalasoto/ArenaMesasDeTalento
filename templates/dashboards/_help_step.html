{% comment %}Paso de ayuda. Params: n (número), icon, title, text (HTML).{% endcomment %}
<div class="card p-5 flex items-start gap-4">
  <span class="relative grid place-items-center w-11 h-11 rounded-xl bg-arena-50 text-arena-600 shrink-0">
    {% include "partials/icon.html" with name=icon cls="w-5 h-5" %}
    <span class="absolute -top-1.5 -left-1.5 grid place-items-center w-5 h-5 rounded-full bg-arena-600 text-white text-[11px] font-bold">{{ n }}</span>
  </span>
  <div class="min-w-0">
    <h3 class="font-semibold text-slate-900">{{ title }}</h3>
    <p class="mt-0.5 text-sm text-slate-600 leading-relaxed">{{ text|safe }}</p>
  </div>
</div>
