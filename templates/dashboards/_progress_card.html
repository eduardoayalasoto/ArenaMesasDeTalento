{% comment %}Tarjeta de avance. Params: title, done, total, icon (opcional).{% endcomment %}
<div class="bg-base-100 border border-base-300 rounded-2xl shadow-sm p-5">
  <div class="flex items-center gap-1.5 mb-1">
    {% if icon %}{% include "partials/icon.html" with name=icon cls="w-4 h-4 text-primary shrink-0" %}{% endif %}
    <p class="text-base text-base-content/60">{{ title }}</p>
  </div>
  <p class="mt-1 text-3xl font-semibold text-base-content tabular-nums">{{ done }}<span class="text-lg text-base-content/50">/{{ total }}</span></p>
  <div class="mt-3 h-2 rounded-full bg-base-200 overflow-hidden">
    <div class="h-full bg-primary" style="width: {% if total %}{% widthratio done total 100 %}{% else %}0{% endif %}%"></div>
  </div>
</div>
