{% comment %}Tarjeta de avance. Params: title, done, total.{% endcomment %}
<div class="card p-5">
  <p class="text-sm text-slate-500">{{ title }}</p>
  <p class="mt-1 text-3xl font-semibold text-slate-900 tabular-nums">{{ done }}<span class="text-lg text-slate-400">/{{ total }}</span></p>
  <div class="mt-3 h-2 rounded-full bg-slate-100 overflow-hidden">
    <div class="h-full bg-arena-500" style="width: {% if total %}{% widthratio done total 100 %}{% else %}0{% endif %}%"></div>
  </div>
</div>
