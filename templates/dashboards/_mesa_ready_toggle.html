<div id="mesa-ready-toggle" class="flex flex-wrap items-center gap-3">
  <button type="button"
    hx-post="{% url 'dashboards:talent_mesa_ready_toggle' pk=target.pk %}"
    hx-target="#mesa-ready-toggle" hx-swap="outerHTML"
    class="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-medium transition {% if note.mesa_ready %}bg-emerald-600 text-white hover:bg-emerald-700{% else %}btn-secondary{% endif %}">
    {% if note.mesa_ready %}
      <i data-lucide="check-circle-2" class="w-4 h-4"></i> Listo en Mesa · quitar
    {% else %}
      <i data-lucide="circle-check" class="w-4 h-4"></i> Marcar como listo en Mesa
    {% endif %}
  </button>
  {% if note.mesa_ready %}
    <span class="text-xs text-slate-500">
      Marcado{% if note.mesa_ready_by %} por {{ note.mesa_ready_by.full_name }}{% endif %}{% if note.mesa_ready_at %} · {{ note.mesa_ready_at|date:"d/m/Y H:i" }}{% endif %}
    </span>
  {% endif %}
</div>
