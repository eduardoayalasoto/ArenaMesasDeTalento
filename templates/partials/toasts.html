{% comment %}Región de notificaciones no intrusivas (aria-live). Convierte los messages de Django en toasts.{% endcomment %}
<div x-data
     class="fixed top-4 right-4 z-[100] flex flex-col gap-3 w-[min(92vw,24rem)]"
     aria-live="polite" aria-atomic="false">
  <template x-for="t in $store.ui.toasts" :key="t.id">
    <div x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-x-8 scale-95" x-transition:enter-end="opacity-100 translate-x-0 scale-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 translate-x-0" x-transition:leave-end="opacity-0 translate-x-8"
         class="bg-white rounded-xl border border-slate-200 shadow-xl ring-1 ring-black/5 px-4 py-3 flex items-start gap-3 border-l-4"
         :class="{
           'border-l-emerald-500': t.level === 'success',
           'border-l-rose-500': t.level === 'error',
           'border-l-amber-500': t.level === 'warning',
           'border-l-arena-600': t.level === 'info' || t.level === 'debug',
         }">
      <span class="mt-0.5 shrink-0 w-2.5 h-2.5 rounded-full"
            :class="{
              'bg-emerald-500': t.level === 'success',
              'bg-rose-500': t.level === 'error',
              'bg-amber-500': t.level === 'warning',
              'bg-arena-600': t.level === 'info' || t.level === 'debug',
            }"></span>
      <p class="text-sm text-slate-700 flex-1" x-text="t.message"></p>
      <button type="button" class="text-slate-400 hover:text-slate-600" @click="$store.ui.dismiss(t.id)" aria-label="Cerrar notificación">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  </template>
</div>

{% if messages %}
<script>
  document.addEventListener('alpine:init', () => {
    {% for message in messages %}
    queueMicrotask(() => Alpine.store('ui').notify("{{ message|escapejs }}", "{{ message.tags|default:'info' }}"));
    {% endfor %}
  });
</script>
{% endif %}
