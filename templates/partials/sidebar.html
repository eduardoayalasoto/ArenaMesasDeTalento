{% comment %}Barra lateral con navegación segregada por rol (nav_items del context processor).{% endcomment %}

<!-- Drawer móvil -->
<div x-show="$store.ui.sidebarOpen" x-cloak class="relative z-40 lg:hidden" role="dialog" aria-modal="true">
  <div x-show="$store.ui.sidebarOpen" x-transition.opacity class="fixed inset-0 bg-slate-900/50"
       @click="$store.ui.sidebarOpen = false"></div>
  <div x-show="$store.ui.sidebarOpen"
       x-transition:enter="transition ease-out duration-200" x-transition:enter-start="-translate-x-full" x-transition:enter-end="translate-x-0"
       x-transition:leave="transition ease-in duration-150" x-transition:leave-start="translate-x-0" x-transition:leave-end="-translate-x-full"
       class="fixed inset-y-0 left-0 w-72 bg-white shadow-xl flex flex-col">
    <div class="flex items-center justify-between px-4 h-16 border-b border-slate-200">
      {% include "partials/_brand.html" %}
      <button type="button" class="btn-ghost p-2" @click="$store.ui.sidebarOpen = false" aria-label="Cerrar menú">
        {% include "partials/icon.html" with name="close" %}
      </button>
    </div>
    {% include "partials/_navlist.html" %}
  </div>
</div>

<!-- Barra fija (escritorio) -->
<aside class="hidden lg:flex lg:flex-col lg:w-64 lg:shrink-0 bg-white border-r border-slate-200 min-h-dvh sticky top-0">
  <div class="flex items-center h-16 px-5 border-b border-slate-200">
    {% include "partials/_brand.html" %}
  </div>
  {% include "partials/_navlist.html" %}
</aside>
