{% extends "base.html" %}
{% block content %}
{% include "learning/_subnav.html" %}
<div>
  <h3 class="text-lg font-semibold text-slate-900 mb-4">Editar reseña: {{ req.name }}</h3>
  <form method="post" class="ui-card p-6 space-y-6" novalidate>
    {% csrf_token %}
    {% for e in review_form.non_field_errors %}<p class="text-base text-rose-600">{{ e }}</p>{% endfor %}
    {% include "learning/_review_fields.html" %}
    <div class="flex justify-end gap-2">
      <a href="{% url 'learning:request_detail' req.pk %}" class="ui-btn-ghost">Cancelar</a>
      <button type="submit" class="ui-btn-primary"><i data-lucide="save" class="w-4 h-4"></i> Guardar reseña</button>
    </div>
  </form>
</div>
{% endblock %}
