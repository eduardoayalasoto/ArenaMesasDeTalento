{% comment %}
Score por categoría de una evaluación de Ownership (spec 008). Vive dentro del x-data `ownershipForm`:
`categories` llega del servidor y se actualiza con cada autoguardado. Se oculta con una sola categoría.
{% endcomment %}
<section class="bg-base-100 border border-base-300 rounded-2xl shadow-sm p-4 mb-6" x-show="categories.length > 1" x-cloak aria-label="Score por categoría">
  <h3 class="font-semibold text-base-content mb-3">Score por categoría</h3>
  <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
    <template x-for="c in categories" :key="c.code">
      <div class="rounded-xl border border-base-300 p-3">
        <p class="text-base font-medium text-base-content" x-text="c.name"></p>
        <p class="text-sm text-base-content/75">Peso <span x-text="c.weight"></span>%</p>
        <p class="mt-1 font-semibold tabular-nums" :class="c.score !== null ? 'text-xl text-base-content' : 'text-base text-base-content/75'" x-text="c.score ?? 'Sin calificar'"></p>
        <p class="text-sm text-base-content/75"><span x-text="c.answered"></span> de <span x-text="c.total"></span> respondidas</p>
      </div>
    </template>
  </div>
</section>
