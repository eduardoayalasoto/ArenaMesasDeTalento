{% comment %}Un criterio de Entrega de Valor: radios 1–4. Params: name, label, help, current, values, disabled.{% endcomment %}
<div>
  <p class="font-medium text-slate-900">{{ label }}</p>
  {% if help %}<p class="text-sm text-slate-600 mb-2">{{ help }}</p>{% endif %}
  <div class="flex flex-wrap gap-2">
    {% for v in values %}
      <label class="cursor-pointer">
        <input type="radio" name="{{ name }}" value="{{ v }}" class="peer sr-only"
               {% if disabled == 'VALIDADA' %}disabled{% endif %} {% if current == v %}checked{% endif %}>
        <span class="badge border border-slate-300 text-slate-600 px-4 py-1.5 peer-checked:bg-arena-600 peer-checked:text-white peer-checked:border-arena-600 transition">{{ v }}</span>
      </label>
    {% endfor %}
  </div>
</div>
