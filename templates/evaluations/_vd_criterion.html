{% load dict_extras %}
{% comment %}Un criterio de Entrega de Valor: radios 1–4. Params: name, label, help, current, values, disabled, can_correct_closed.{% endcomment %}
<div>
  <p class="font-medium text-base-content">{{ label }}</p>
  {% if help %}<p class="text-base text-base-content/70 mb-2">{{ help }}</p>{% endif %}
  <div class="flex flex-wrap gap-2">
    {% for v in values %}
      <label class="cursor-pointer">
        <input type="radio" name="{{ name }}" value="{{ v }}" class="peer sr-only"
               {% if disabled == 'VALIDADA' and not can_correct_closed %}disabled{% endif %} {% if current == v %}checked{% endif %}>
        <span class="badge border border-base-300 text-base-content/70 px-4 py-1.5 peer-checked:bg-primary peer-checked:text-white peer-checked:border-primary transition">{{ v }} · {{ v|scale_label }}</span>
      </label>
    {% endfor %}
  </div>
</div>
